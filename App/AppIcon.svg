<?xml version="1.0" encoding="UTF-8"?>
<!-- App icon master. Apple's macOS grid: a 1024 canvas, an 824 body inset by
     100, room below for the drop shadow. make-icon.sh renders App/AppIcon.icns
     from this file; edit here, never the .icns. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A3C"/>
      <stop offset="1" stop-color="#161618"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.26"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
  <!-- Eject glyph; its bar doubles as Time Machine progress. -->
  <path d="M512 318 L694 514 L330 514 Z" fill="#ffffff" stroke="#ffffff" stroke-width="40" stroke-linejoin="round"/>
  <rect x="310" y="590" width="404" height="62" rx="31" fill="#ffffff" fill-opacity="0.2"/>
  <rect x="310" y="590" width="262" height="62" rx="31" fill="#30D158"/>
</svg>
